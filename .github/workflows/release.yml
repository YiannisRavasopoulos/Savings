# Publishes a release when a version tag is pushed. Savings and the widget are released
# separately:
#   v1.3.0          -> savings-1.3.0.tar.gz        (packaging/app/make-release.sh --verify)
#   widget-v1.5.1   -> savings-widget-1.5.1.tar.gz (packaging/widget/make-release.sh)
# The tag must match VERSION / widget/package/metadata.json, and CHANGELOG.md must have the
# dated section for it; its text becomes the release notes.
name: Release

on:
  push:
    tags: ["v*.*.*", "widget-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Which release?
        id: what
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == widget-v* ]]; then
            kind=widget; version="${tag#widget-v}"
            have="$(python3 -c 'import json; print(json.load(open("widget/package/metadata.json"))["KPlugin"]["Version"])')"
          else
            kind=app; version="${tag#v}"; have="$(cat VERSION)"
          fi
          [ "$version" = "$have" ] || { echo "::error::tag $tag doesn't match the version in the code ($have)"; exit 1; }
          echo "kind=$kind" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Savings (with the full test run)
        if: steps.what.outputs.kind == 'app'
        run: packaging/app/make-release.sh --verify

      - name: Build the widget
        if: steps.what.outputs.kind == 'widget'
        # (--verify needs KDE's kpackagetool6, which the runner doesn't have; it's run locally)
        run: packaging/widget/make-release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind="${{ steps.what.outputs.kind }}"; v="${{ steps.what.outputs.version }}"
          if [ "$kind" = app ]; then files=(release/savings-$v.tar.gz release/savings-$v.tar.gz.sha256); title="Savings $v"
          else files=(release/savings-widget-$v.tar.gz release/savings-widget-$v.tar.gz.sha256); title="Savings widget $v"; fi
          python3 packaging/release-checks.py notes CHANGELOG.md "$kind" "$v" > notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$title" --notes-file notes.md
