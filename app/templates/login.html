{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Log in</h1>
  {% if notice %}<div class="flash" role="status">{{ notice }}</div>{% endif %}
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="panel">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="f-username">Username</label>
      <input id="f-username" name="username" required autocomplete="username" autocapitalize="none"
             autocorrect="off" spellcheck="false" value="{{ values.get('username', '') }}" autofocus>
    </div>
    <div class="field">
      <label for="f-password">Password</label>
      <input id="f-password" name="password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary">Log in</button>
  </form>
  <p class="auth-alt">No account yet? <a href="/register">Request one</a></p>
</div>
{% endblock %}
