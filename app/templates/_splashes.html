<!-- Splash screens (plain HTML, no template code: ./preview-splashes.sh reuses this file).
     Only one shows: html[data-splash="<name>"] picks it (see the head script in base.html).
     Styles and timings are in static/splash.css. -->
<div class="splash-screen" id="splash" aria-hidden="true">

  <!-- 1. tumble: the logo and the letters fall from above, tumbling, and bounce into place -->
  <div class="sp-scene splash-tumble">
    <img class="sp-icon" src="/static/icons/icon-192.png" alt="" width="96" height="96">
    <div class="sp-name"><span style="--x: -90px; --r: -160deg; --i: 0">S</span><span style="--x: 60px; --r: 220deg; --i: 1">a</span><span style="--x: -40px; --r: -260deg; --i: 2">v</span><span style="--x: 110px; --r: 180deg; --i: 3">i</span><span style="--x: -120px; --r: -200deg; --i: 4">n</span><span style="--x: 30px; --r: 300deg; --i: 5">g</span><span style="--x: 80px; --r: -240deg; --i: 6">s</span></div>
  </div>

  <!-- 2. coins: € coins rain down into a pile that turns into the logo; the name types itself -->
  <div class="sp-scene splash-coins">
    <div class="sp-stage">
      <span class="sp-coin" style="--x: -48px; --y: 0px; --x0: -120px; --d: 0">€</span>
      <span class="sp-coin" style="--x: -16px; --y: 0px; --x0: 70px; --d: 1">€</span>
      <span class="sp-coin" style="--x: 16px; --y: 0px; --x0: -40px; --d: 2">€</span>
      <span class="sp-coin" style="--x: 48px; --y: 0px; --x0: 130px; --d: 3">€</span>
      <span class="sp-coin" style="--x: -32px; --y: -26px; --x0: 20px; --d: 4">€</span>
      <span class="sp-coin" style="--x: 0px; --y: -26px; --x0: -90px; --d: 5">€</span>
      <span class="sp-coin" style="--x: 32px; --y: -26px; --x0: 100px; --d: 6">€</span>
      <span class="sp-coin" style="--x: -16px; --y: -52px; --x0: -60px; --d: 7">€</span>
      <span class="sp-coin" style="--x: 16px; --y: -52px; --x0: 50px; --d: 8">€</span>
      <span class="sp-coin" style="--x: 0px; --y: -78px; --x0: 0px; --d: 9">€</span>
      <img class="sp-icon" src="/static/icons/icon-192.png" alt="" width="96" height="96">
    </div>
    <div class="sp-name sp-typed"><span style="--i: 0">S</span><span style="--i: 1">a</span><span style="--i: 2">v</span><span style="--i: 3">i</span><span style="--i: 4">n</span><span style="--i: 5">g</span><span style="--i: 6">s</span><span class="sp-caret"></span></div>
  </div>

  <!-- 3. piggy: the logo fills up with green like liquid; the letters pop up one by one -->
  <div class="sp-scene splash-piggy">
    <div class="sp-fill">
      <img class="sp-icon sp-empty" src="/static/icons/icon-192.png" alt="" width="96" height="96">
      <img class="sp-icon sp-full" src="/static/icons/icon-192.png" alt="" width="96" height="96">
      <span class="sp-wave"></span>
    </div>
    <div class="sp-name sp-pop"><span style="--i: 0">S</span><span style="--i: 1">a</span><span style="--i: 2">v</span><span style="--i: 3">i</span><span style="--i: 4">n</span><span style="--i: 5">g</span><span style="--i: 6">s</span></div>
  </div>

  <!-- 4. slots: each letter spins like a slot-machine reel and stops on its letter, left to right -->
  <div class="sp-scene splash-slots">
    <img class="sp-icon" src="/static/icons/icon-192.png" alt="" width="96" height="96">
    <div class="sp-name sp-reels">
      <span class="sp-reel" style="--i: 0"><span class="sp-strip"><b>7</b><b>€</b><b>$</b><b>%</b><b>£</b><b>S</b></span></span>
      <span class="sp-reel" style="--i: 1"><span class="sp-strip"><b>€</b><b>7</b><b>£</b><b>$</b><b>%</b><b>a</b></span></span>
      <span class="sp-reel" style="--i: 2"><span class="sp-strip"><b>$</b><b>%</b><b>7</b><b>€</b><b>£</b><b>v</b></span></span>
      <span class="sp-reel" style="--i: 3"><span class="sp-strip"><b>%</b><b>£</b><b>€</b><b>7</b><b>$</b><b>i</b></span></span>
      <span class="sp-reel" style="--i: 4"><span class="sp-strip"><b>£</b><b>$</b><b>%</b><b>€</b><b>7</b><b>n</b></span></span>
      <span class="sp-reel" style="--i: 5"><span class="sp-strip"><b>7</b><b>%</b><b>€</b><b>£</b><b>$</b><b>g</b></span></span>
      <span class="sp-reel" style="--i: 6"><span class="sp-strip"><b>€</b><b>£</b><b>7</b><b>$</b><b>%</b><b>s</b></span></span>
    </div>
  </div>

  <!-- 5. typewriter: "Savings" types out with a blinking cursor; a "SAVED" stamp thumps down underneath -->
  <div class="sp-scene splash-typewriter">
    <img class="sp-icon" src="/static/icons/icon-192.png" alt="" width="96" height="96">
    <div class="sp-name sp-typed sp-mono"><span style="--i: 0">S</span><span style="--i: 1">a</span><span style="--i: 2">v</span><span style="--i: 3">i</span><span style="--i: 4">n</span><span style="--i: 5">g</span><span style="--i: 6">s</span><span class="sp-caret"></span></div>
  </div>

  <!-- 6. chart: a green line draws a rising chart that turns into the logo -->
  <div class="sp-scene splash-chart">
    <div class="sp-stage">
      <svg class="sp-graph" viewBox="0 0 200 120" width="200" height="120">
        <path class="sp-grid" d="M0 30H200M0 60H200M0 90H200"/>
        <path class="sp-line" pathLength="100" d="M4 112 L36 92 L62 100 L92 66 L120 74 L150 40 L178 46 L196 8"/>
        <circle class="sp-dot" cx="196" cy="8" r="6"/>
      </svg>
      <img class="sp-icon" src="/static/icons/icon-192.png" alt="" width="96" height="96">
    </div>
    <div class="sp-name sp-rise">Savings</div>
  </div>

  <!-- 7. vault: the logo appears, a vault door behind it unlocks and swings open, and the view
       zooms past the logo into the dark inside, fading into the app -->
  <div class="sp-scene splash-vault">
    <div class="sp-zoom">
      <div class="sp-vault">
        <div class="sp-vault-inside"></div>
        <div class="sp-vault-door">
          <span class="sp-bolt" style="--a: 0deg"></span><span class="sp-bolt" style="--a: 60deg"></span>
          <span class="sp-bolt" style="--a: 120deg"></span><span class="sp-bolt" style="--a: 180deg"></span>
          <span class="sp-bolt" style="--a: 240deg"></span><span class="sp-bolt" style="--a: 300deg"></span>
          <span class="sp-wheel"><i></i><i></i><i></i></span>
        </div>
      </div>
      <img class="sp-icon" src="/static/icons/icon-192.png" alt="" width="96" height="96">
    </div>
    <div class="sp-name sp-vault-name">Savings</div>
  </div>

  <!-- festive season (24 Dec – 1 Jan, not in the rotation): snow falls, the logo lands and gets a
       Santa hat, and the letters hang from a garland as swinging baubles -->
  <div class="sp-scene splash-christmas">
    <div class="sp-snow"><i style="--fx: 4%; --fd: 0s; --fs: 6px; --ft: 2.6s"></i><i style="--fx: 12%; --fd: 0.9s; --fs: 4px; --ft: 3.1s"></i><i style="--fx: 21%; --fd: 0.3s; --fs: 7px; --ft: 2.4s"></i><i style="--fx: 29%; --fd: 1.4s; --fs: 5px; --ft: 2.9s"></i><i style="--fx: 37%; --fd: 0.6s; --fs: 4px; --ft: 3.3s"></i><i style="--fx: 46%; --fd: 0.1s; --fs: 6px; --ft: 2.7s"></i><i style="--fx: 54%; --fd: 1.1s; --fs: 5px; --ft: 3.0s"></i><i style="--fx: 62%; --fd: 0.4s; --fs: 7px; --ft: 2.5s"></i><i style="--fx: 70%; --fd: 1.6s; --fs: 4px; --ft: 3.2s"></i><i style="--fx: 78%; --fd: 0.2s; --fs: 6px; --ft: 2.8s"></i><i style="--fx: 86%; --fd: 1.2s; --fs: 5px; --ft: 2.6s"></i><i style="--fx: 94%; --fd: 0.7s; --fs: 4px; --ft: 3.1s"></i><i style="--fx: 17%; --fd: 1.8s; --fs: 5px; --ft: 2.7s"></i><i style="--fx: 58%; --fd: 1.9s; --fs: 4px; --ft: 2.9s"></i><i style="--fx: 82%; --fd: 0.5s; --fs: 7px; --ft: 2.4s"></i><i style="--fx: 41%; --fd: 1.5s; --fs: 6px; --ft: 3.0s"></i></div>
    <div class="sp-hatted">
      <img class="sp-icon" src="/static/icons/icon-192.png" alt="" width="96" height="96">
      <span class="sp-hat"></span>
    </div>
    <div class="sp-garland">
      <span class="sp-string"></span>
      <span class="sp-bauble" style="--i: 0">S</span><span class="sp-bauble" style="--i: 1">a</span><span class="sp-bauble" style="--i: 2">v</span><span class="sp-bauble" style="--i: 3">i</span><span class="sp-bauble" style="--i: 4">n</span><span class="sp-bauble" style="--i: 5">g</span><span class="sp-bauble" style="--i: 6">s</span>
    </div>
  </div>

  <div class="sp-note"></div>
  <div class="sp-stamp">Saved</div>
</div>
